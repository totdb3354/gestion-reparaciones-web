# Rate limiting del login (guia de hardening de la VM): 5 intentos/minuto por IP, rafaga de 3.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name erp.fonestore.es;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.fonestore.es;

    ssl_certificate     /etc/letsencrypt/live/erp.fonestore.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.fonestore.es/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/erp.access.log;
    error_log  /var/log/nginx/erp.error.log;

    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    # El index no se cachea: es el que trae las rutas nuevas de assets tras cada despliegue.
    # nginx sustituye los add_header del padre en cuanto un hijo define alguno, asi que cada
    # location que anade cabeceras repite tambien las de seguridad.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        location ~* \.(js|css|png|ico)$ {
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
